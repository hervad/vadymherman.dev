[defaults]
inventory = inventory/production.yml
roles_path = roles
collections_path = collections
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# Secrets live in group_vars/all.vault.yml, encrypted with ansible-vault (added in step 1.3).
# vault_password_file = .vault_pass   # gitignored; never commit it

[ssh_connection]
pipelining = true
