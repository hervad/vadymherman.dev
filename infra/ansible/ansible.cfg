[defaults]
inventory = inventory/production.yml
roles_path = roles
collections_path = collections
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# Secrets live in inventory/group_vars/all/secrets.vault.yml, encrypted with ansible-vault.
# group_vars must sit next to the inventory (or the playbook) or ansible-playbook never loads it.
# vault_password_file = .vault_pass   # gitignored; never commit it

[ssh_connection]
pipelining = true
