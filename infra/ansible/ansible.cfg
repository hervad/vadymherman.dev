[defaults]
# Default = the local lab VM. Production must always be chosen explicitly:
#   ansible-playbook -i inventory/production.yml ...  (or make ansible-check)
inventory = inventory/local.yml
roles_path = roles
collections_path = collections
stdout_callback = default
# Task results as YAML instead of one-line JSON. The key is callback_result_format;
# a plain "result_format" is silently ignored. Prove what Ansible read with:
#   ansible-config dump --only-changed -t all
callback_result_format = yaml
# Facts only via ansible_facts['...'], not as top-level ansible_* variables.
# The old default (True) is deprecated and flips to False in ansible-core 2.24.
inject_facts_as_vars = False
retry_files_enabled = false
interpreter_python = auto_silent
# Secrets live in inventory/group_vars/all/secrets.vault.yml, encrypted with ansible-vault.
# group_vars must sit next to the inventory (or the playbook) or ansible-playbook never loads it.
# Vault password file: one line, chmod 600, gitignored; never commit it.
# (A '#' after a value is NOT a comment in ansible.cfg: it becomes part of the value.)
vault_password_file = .vault_pass

[ssh_connection]
pipelining = true
