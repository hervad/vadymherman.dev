# Role: caddy (roadmap step 1.3, piece 5)
# The front door and the waiter: Caddy answers visitors over HTTPS and hands out the
# pre-made pages from site_root/current.
# Order matters: SELinux tools → package repository → package → folders → Caddyfile → service.
# TODO(3.5): systemd hardening drop-in (start from `systemd-analyze security caddy`).

- name: "caddy | Have the SELinux tools in place before the package"
  # Caddy's package labels its own files and ports with `semanage` while it installs, and
  # skips that step without any error if the tool is missing (see: rpm -q --scripts caddy).
  # The tool comes from this package. The base role installs it too; it is repeated here
  # so this role is safe on its own, and in its own task so it is there *before* Caddy.
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present

- name: "caddy | Enable the Caddy project's package repository (COPR)"
  # Writes one file into /etc/yum.repos.d/ (gpgcheck=1: packages must carry the project's
  # signature). In a dry run the module asks COPR for the file but does not write it.
  community.general.copr:
    name: "{{ caddy_copr_project }}"
    chroot: "{{ caddy_copr_chroot }}"
    state: enabled
  register: caddy_copr_result          # remembered so the next task knows if the repo is brand new

- name: "caddy | Install Caddy"
  # present = install if missing, never upgrade by itself: upgrades are deliberate (ADR 0011).
  # latest  = only when the run is started with -e caddy_upgrade=true.
  ansible.builtin.dnf:
    name: caddy
    state: "{{ 'latest' if caddy_upgrade | bool else 'present' }}"
  # Dry run on a fresh server: the repository was only "pretend-enabled", so dnf could not
  # find the package and would fail. Same pattern as the firewall role.
  when: not (ansible_check_mode and caddy_copr_result is changed)

- name: "caddy | Create the site folders, labelled as web content from the start"
  # A new folder inherits its parent's label (/srv is var_t), and the selinux role runs
  # before this one, so the label is set here, at creation (setype).
  # releases/ belongs to the deploy user: CI uploads each build there from step 1.4.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
    setype: "{{ caddy_site_setype }}"
  loop:
    - { path: "{{ site_root }}", owner: root }
    - { path: "{{ site_root }}/releases", owner: "{{ deploy_user }}" }
    - { path: "{{ site_root }}/releases/placeholder", owner: root }
    - { path: "{{ site_root }}/releases/placeholder/en", owner: root }
  register: caddy_site_dirs_result     # remembered so the next tasks know if the folders are brand new

- name: "caddy | Put a placeholder page where a release will be"
  # Same shape as a real build: the pages live under /en/, the error page is /en/404.html.
  ansible.builtin.template:
    src: "placeholder/{{ item }}.j2"
    dest: "{{ site_root }}/releases/placeholder/en/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    setype: "{{ caddy_site_setype }}"
  loop:
    - index.html
    - 404.html
  # Dry run on a fresh server: the folders were only "pretend-created", there is nowhere to write.
  when: not (ansible_check_mode and caddy_site_dirs_result is changed)

- name: "caddy | Look whether a release is already live"
  # stat only reads. It does not follow the link, so even a link to a deleted release counts.
  ansible.builtin.stat:
    path: "{{ site_root }}/current"
  register: caddy_current_result

- name: "caddy | Point 'current' at the placeholder, only if nothing is live yet"
  # From step 1.4 the deploy job owns this link and points it at releases/<sha>.
  # Without the first condition, every Ansible run would switch the live site back to
  # the placeholder. The target is relative, so it is resolved from the folder the link is in.
  ansible.builtin.file:
    src: releases/placeholder
    dest: "{{ site_root }}/current"
    state: link
    follow: false                      # label the link itself, not what it points at
    setype: "{{ caddy_site_setype }}"
  when:
    - not caddy_current_result.stat.exists
    - not (ansible_check_mode and caddy_site_dirs_result is changed)

- name: "caddy | Look whether Caddy is installed"
  # Always true after a real run. False only in a dry run on a fresh server, where the
  # install was skipped: then there is nothing to configure or start yet.
  ansible.builtin.stat:
    path: /usr/bin/caddy
  register: caddy_binary_result

- name: "caddy | Write the Caddyfile"
  # validate: Caddy itself checks the new file (%s = a temporary copy) before it replaces
  # the old one. A file with a mistake never reaches /etc/caddy. Same pattern as sshd -t.
  # --adapter caddyfile: the temporary copy is not named "Caddyfile", so say what format it is.
  # XDG_DATA_HOME: the check runs as root and loads the config for real, which creates
  # data files (on the lab: a second private authority in /root/.local/share/caddy, found
  # 2026-11-27). /run is memory only, so whatever the check creates is gone after a reboot.
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/env XDG_DATA_HOME=/run/caddy-validate /usr/bin/caddy validate --adapter caddyfile --config %s
  notify: Reload caddy
  when: caddy_binary_result.stat.exists

- name: "caddy | Start Caddy now and at every boot"
  # started = running now; enabled = started again after a reboot.
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true
  when: caddy_binary_result.stat.exists
