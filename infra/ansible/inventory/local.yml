# Local KVM twin of the VPS (step 1.3): AlmaLinux 10 cloud image + cloud-init, created with
# virt-install on Kai's desktop. Every role is proven here before it touches production.
# The address comes from libvirt's DHCP; after a reset check it with: virsh domifaddr vh-lab
all:
  hosts:
    vh-lab:
      ansible_host: 192.168.122.176
      ansible_user: kai                 # until users_ssh has run: -e ansible_user=almalinux
      # The lab has no public name, so Let's Encrypt cannot reach it: Caddy signs the lab's
      # certificates with its own private authority instead (ADR 0011). Test with:
      #   curl --resolve vadymherman.dev:443:<lab address> --cacert <lab root certificate> ...
      caddy_tls_internal: true
