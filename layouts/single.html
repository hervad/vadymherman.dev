{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{- if eq .Section "blog" }}
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
    </p>
    {{- end }}
  </header>
  {{ .Content }}
  {{- with .GetTerms "tags" }}
  <footer>
    <ul class="tags" aria-label="{{ i18n "tags" }}">
      {{- range . }}
      <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{- end }}
    </ul>
  </footer>
  {{- end }}
</article>
{{ end }}
