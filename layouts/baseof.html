<!doctype html>
<html lang="{{ site.Language.Name }}">
<head>
  {{- partial "head.html" . }}
</head>
<body{{ if .IsHome }} class="home"{{ end }}>
  <a class="skip-link" href="#main">{{ i18n "skipToContent" }}</a>
  {{- partial "build-strip.html" . }}
  <div class="wrap">
    {{- partial "header.html" . }}
    <main id="main">
      {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
  </div>
</body>
</html>
