<header class="site-header">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  <nav aria-label="{{ i18n "mainNav" }}">
    <ul>
      {{- range site.Sections.ByWeight }}
      <li><a href="{{ .RelPermalink }}"{{ if or ($.Eq .) (.IsAncestor $) }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
      {{- end }}
      {{- with site.GetPage "/about" }}
      <li><a href="{{ .RelPermalink }}"{{ if $.Eq . }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
