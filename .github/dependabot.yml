# Dependabot keeps the SHA-pinned actions in .github/workflows/ current: once a week it checks
# for new releases and opens a PR that updates both the SHA and the "# vX.Y.Z" comment.
# Hugo and Pagefind are pinned in versions.env instead (bump them by hand + `make tool-hashes`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
